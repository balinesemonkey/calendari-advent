<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bali → Barcelona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/calendar.css?v=3">
</head>
<body>

<header class="masthead">
  <div class="masthead__title">
    <h1>Bali <span class="arrow">→</span> Barcelona</h1>
    <p class="masthead__sub">Una cançó cada dia, tot el camí cap a casa</p>
  </div>

  <div class="masthead__meta">
    <div class="stat">
      <span class="stat__num" id="statOpen">—</span>
      <span class="stat__label">obertes</span>
    </div>
    <div class="stat">
      <span class="stat__num" id="statLeft">—</span>
      <span class="stat__label">que falten</span>
    </div>
    <button class="btn" id="jumpToday">Avui</button>
  </div>
</header>

<div class="scroller" id="scroller">
  <div class="card" id="card">

    <svg class="mapart" id="mapArt" viewBox="0 0 62000 1600" preserveAspectRatio="none" aria-hidden="true"></svg>

    <svg class="route" id="routeSvg" viewBox="0 0 62000 1600" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="inkBleed" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <path id="routePath" class="route__ghost" fill="none" filter="url(#inkBleed)"/>
      <path id="routeWalked" class="route__walked" fill="none" filter="url(#inkBleed)"/>
    </svg>

    <div class="layer" id="doorLayer"></div>
    <div class="walker" id="walker" hidden><span class="walker__pin"></span></div>

  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal__scrim" id="modalScrim"></div>
  <div class="modal__panel" role="dialog" aria-modal="true" id="modalPanel">
    <button class="modal__close" id="modalClose" aria-label="Tanca">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="devbar">
  <label>Data de previsualització
    <input type="date" id="devDate" min="2026-08-14" max="2026-12-20">
  </label>
  <button class="btn btn--ghost" id="devReset">Reinicia les obertes</button>
  <span class="devbar__note">controls del prototip — no formen part del producte final</span>
</div>

<script src="js/songs.js?v=3"></script>
<script src="js/map.js?v=3"></script>
<script src="js/calendar.js?v=3"></script>
</body>
</html>
