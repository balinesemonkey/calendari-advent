<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>El Nostre Calendari d'Advent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/calendar.css?v=5">
</head>
<body>

<header class="masthead">
  <div class="masthead__title">
    <h1>El Nostre Calendari d'Advent</h1>
  </div>

  <div class="masthead__meta">
    <button class="btn btn--compass" id="jumpToday" aria-label="Avui" title="Avui">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="12.5"/>
        <circle cx="16" cy="16" r="8.5" opacity=".5"/>
        <path class="btn--compass__needle" d="M16 6.5 L20 16 L16 25.5 L12 16 Z"/>
      </svg>
    </button>
  </div>
</header>

<div class="scroller" id="scroller">
  <div class="card" id="card">

    <svg class="mapart" id="mapArt" viewBox="0 0 62000 1600" preserveAspectRatio="none" aria-hidden="true"></svg>

    <svg class="route" id="routeSvg" viewBox="0 0 62000 1600" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <!-- filterUnits/region set in JS once the viewBox is known: a
             percentage-of-bounding-box region (the default) blows up on
             a path this long and thin, which Safari fails to rasterise
             at all — see calendar.js. -->
        <filter id="inkBleed" filterUnits="userSpaceOnUse">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <path id="routePath" class="route__ghost" fill="none" filter="url(#inkBleed)"/>
      <path id="routeWalked" class="route__walked" fill="none" filter="url(#inkBleed)"/>
    </svg>

    <div class="layer" id="doorLayer"></div>

  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal__scrim" id="modalScrim"></div>
  <div class="modal__panel" role="dialog" aria-modal="true" id="modalPanel">
    <button class="modal__close" id="modalClose" aria-label="Tanca">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="devbar">
  <label>Data de previsualització
    <input type="date" id="devDate" min="2026-08-18" max="2026-12-20">
  </label>
  <button class="btn btn--ghost" id="devReset">Reinicia les obertes</button>
  <span class="devbar__note">controls del prototip — no formen part del producte final</span>
</div>

<script src="js/songs.js?v=5"></script>
<script src="js/scenes.js?v=5"></script>
<script src="js/map.js?v=5"></script>
<script src="js/calendar.js?v=5"></script>
</body>
</html>
